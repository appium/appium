name: Appium Deploy
on:
  push:
    tags:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  filter_matrix:
    needs:
      - prepare_matrix
    name: Filter supported Node versions
    uses: ./.github/workflows/filter-node-matrix.yml
    with:
      versions: ${{ needs.prepare_matrix.outputs.versions }}

  check:
    needs:
      - filter_matrix
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.filter_matrix.outputs.versions) }}
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Appium
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            npm i --location=global $GITHUB_REF_NAME
          else
            npm i --location=global appium
          fi
        shell: bash
      - name: Install drivers and plugins
        run: |
          if grep -q macos <<< ${{ matrix.os }}; then
            appium driver install xcuitest
          fi
          appium driver install uiautomator2
          appium plugin install images
        shell: bash
      - name: Verify installation
        run: |
          installed_drivers=$(appium driver list --installed 2>&1)
          if grep -q macos <<< ${{ matrix.os }}; then
            grep -q xcuitest <<< $installed_drivers
          fi
          grep -q uiautomator2 <<< $installed_drivers
          installed_plugins=$(appium plugin list --installed 2>&1)
          grep -q images <<< $installed_plugins
        shell: bash
      - name: Verify Appium could be executed
        run: |
          appium --use-plugins=images &
          pid=$(echo $!)
          sleep 5
          ps -p $pid || exit 1
          kill -2 $pid
        shell: bash
