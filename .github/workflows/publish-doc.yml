name: Publish docs

on:
  workflow_dispatch:
  push:
    # Runs when any new tag is pushed = there is a new release
    # Pattern matched against refs/tags, so does not trigger for tags with a slash, e.g. 1.0/beta
    tags:        
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: Setup Node and install deps (LTS)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          install-command: npm ci
          run-build: 'true'
      - name: Install dependencies (Python)
        run: npm run install-docs-deps
      - name: Fetch gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
      - name: Publish docs
        run: |
          npm run docs:publish
