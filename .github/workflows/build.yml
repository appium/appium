name: Appium Build
on:
  push:
    branches:
      - master
      - appium4
    # this list of paths could potentially impact the build
    paths:
      - '**/tsconfig*.json'
      - 'packages/base-driver/test-fixtures/**/*'
      - 'packages/*/test/**'
      - 'packages/*/bin'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.cjs'
      - 'packages/**/*.ts'
      - 'packages/**/*.json'
      - 'package*.json'
      - 'lerna.json'
      - '.npmrc'
      - '.github/workflows/build.yml' # this file
      - 'oxlint.config.mjs'
      - 'oxfmt.config.mjs'
      - '!**/sample-code/**'
      - '!packages/*/docs/**'
  pull_request:
    branches:
      - master
      - appium4
    paths:
      - '**/tsconfig*.json'
      - 'packages/base-driver/test-fixtures/**/*'
      - 'packages/*/test/**'
      - 'packages/*/bin'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.cjs'
      - 'packages/**/*.ts'
      - 'packages/**/*.json'
      - 'package*.json'
      - 'lerna.json'
      - '.npmrc'
      - '.github/workflows/build.yml' # this file
      - 'oxlint.config.mjs'
      - 'oxfmt.config.mjs'
      - '!**/sample-code/**'
      - '!packages/*/docs/**'

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  prepare_e2e_packages:
    needs:
      - prepare_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover-packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Discover packages with e2e tests
        id: discover-packages
        env:
          NODE_VERSIONS: ${{ needs.prepare_matrix.outputs.versions }}
        run: |
          targets='[]'
          for package_dir in packages/*/; do
            package_json="${package_dir}package.json"
            if [[ -f "$package_json" ]]; then
              # Check if package.json has test:e2e script and it's not a no-op
              has_e2e=$(node -e "
                try {
                  const pkg = require('./$package_json');
                  const script = pkg.scripts && pkg.scripts['test:e2e'];
                  if (script && !script.includes('echo') && !script.includes('No e2e tests')) {
                    console.log('true');
                  }
                } catch(e) {
                  // Ignore errors
                }
              ")
              if [[ "$has_e2e" == "true" ]]; then
                # Use the directory path without packages/ prefix (remove trailing slash)
                package_name="${package_dir%/}"
                package_name="${package_name#packages/}"
                # Packages with a test:e2e:shards script print a JSON array of shard names
                shards='[""]'
                if node -e "process.exit(require('./$package_json').scripts?.['test:e2e:shards'] ? 0 : 1)"; then
                  shards=$(cd "$package_dir" && npm run --silent test:e2e:shards)
                fi
                targets=$(jq -c --arg pkg "$package_name" --argjson shards "$shards" \
                  '. + [$shards[] | {package_dir: $pkg, shard: ., name: (if . == "" then $pkg else "\($pkg) [\(.)]" end)}]' \
                  <<< "$targets")
              fi
            fi
          done
          echo "Found e2e targets:"
          echo "$targets" | jq -r '.[].name' | sed 's/^/  - /'
          # All LTS versions of Node.js on Linux, the newest one on Windows
          matrix=$(jq -c --argjson versions "$NODE_VERSIONS" '
            [.[] as $target
              | ($versions[] | {os: "ubuntu-latest", "node-version": ., target: $target}),
                {os: "windows-latest", "node-version": ($versions | map(tostring | tonumber) | max), target: $target}]
          ' <<< "$targets")
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  test-smoke:
    needs:
      - prepare_matrix
    name: Smoke Tests
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.prepare_matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
          install-command: npm ci --foreground-scripts
          run-build: 'true'
      - name: Run smoke tests
        run: npm run test:smoke

  test-unit:
    needs:
      - prepare_matrix
    name: Unit Tests
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.prepare_matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
          install-command: npm ci --foreground-scripts
          run-build: 'true'
      - name: Run unit tests
        run: npm run test:unit

  test-types:
    needs:
      - prepare_matrix
    name: Type Tests
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.prepare_matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
          install-command: npm ci --foreground-scripts
          run-build: 'true'
      - name: Run type tests
        run: npm run test:types

  test-e2e:
    needs:
      - prepare_e2e_packages
    name: E2E Tests - ${{ matrix.target.name }} (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_e2e_packages.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
          install-command: npm ci --foreground-scripts
          run-build: 'true'
          socket-firewall: 'false'
      - name: Run E2E tests for ${{ matrix.target.name }}
        run: |
          set -o pipefail
          cd "packages/${{ matrix.target.package_dir }}"
          npm run test:e2e -- ${{ matrix.target.shard }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup and install (no build)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          install-command: npm ci
          run-build: 'false'
      - name: Lint
        run: npm run lint:ci
      - name: Format check
        run: npm run format:check
      - name: Verify changelog generation
        run: npm run verify:changelog-generation
