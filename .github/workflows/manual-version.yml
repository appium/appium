# This job only publishes new releases on GitHub and updates the changelog, without publishing to NPM.
# It can be used if the standard release workflow failed and *only* published to NPM.

name: Appium Server Version (Without NPM Publish)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    # keep this branch name in sync with env.BETA_BRANCH below - the `env` context isn't available
    # to jobs.<job_id>.if (GitHub Actions resolves it before job-level env is set up)
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/appium4') && contains(fromJSON('["mykola-mokhnach", "jlipps", "eglitise", "KazuCocoa"]'), github.actor)
    env:
      BETA_BRANCH: appium4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup Node and install deps (LTS)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          install-command: npm ci
          run-build: 'true'

      - name: Run Lerna version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BETA_FLAGS=""
          if [ "${{ github.ref_name }}" = "$BETA_BRANCH" ]; then
            BETA_FLAGS="--conventional-prerelease --preid beta"
          fi
          npx lerna version --exact --yes $BETA_FLAGS
